name: Android APK

# Builds the BoostPay Android app (Capacitor) without needing Android Studio.
#   · every push to main that touches the app/mobile code → debug APK artifact
#   · manual run (Actions → Android APK → Run workflow) → choose which app to build
#
# The APK is attached to the run as a downloadable artifact (and to the Release
# when you push a tag like v1.0.0).

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        default: 'user'
        type: choice
        options: [user, agent, management, admin]

jobs:
  apk:
    name: Build ${{ github.event.inputs.app || 'user' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP: ${{ github.event.inputs.app || 'user' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Build web bundle + copy into the Android shell
        working-directory: mobile
        run: node scripts/prepare.mjs "$APP"

      - name: Brand the launcher icon / splash
        working-directory: mobile
        run: node scripts/icons.mjs "$APP"

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      # Debug APK — installable on any phone, no Play Store, no signing setup.
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      # Release APK — only when the signing secrets exist (see mobile/README.md §6).
      - name: Decode keystore (optional)
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/boostpay-release.keystore
          echo "present=true" >> $GITHUB_OUTPUT

      - name: Build release APK (signed)
        if: ${{ steps.keystore.outputs.present == 'true' }}
        working-directory: mobile/android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/boostpay-release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect APKs
        run: |
          mkdir -p out
          find mobile/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          for f in out/*.apk; do
            base=$(basename "$f" .apk)
            mv "$f" "out/boostpay-$APP-$base.apk"
          done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: boostpay-${{ env.APP }}-apk
          path: out/*.apk
          retention-days: 30

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
