name: Android APK

# Builds the BoostPay Android apps (Capacitor) without needing Android Studio.
#
#   · Manual run  → choose "all" (default) or a single app
#   · Push to main that touches the app/mobile code → all four apps
#
# Artifacts: boostpay-<app>-apk (debug, installable on any phone).
# Tag push (v1.0.0) also attaches the APKs to the GitHub Release.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        default: 'all'
        type: choice
        options: [all, user, agent, management, admin]

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
      - id: matrix
        run: |
          APP="${{ github.event.inputs.app || 'all' }}"
          if [ "$APP" = "all" ]; then
            echo 'apps=["user","agent","management","admin"]' >> $GITHUB_OUTPUT
          else
            echo "apps=[\"$APP\"]" >> $GITHUB_OUTPUT
          fi

  apk:
    name: ${{ matrix.app }} APK
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One failing app must not stop the other three.
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only the web deps (no server needed) — keeps the four builds quick.
      - name: Install web dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Build web bundle + copy into the Android shell
        working-directory: mobile
        env:
          APP: ${{ matrix.app }}
        run: node scripts/prepare.mjs "$APP"

      - name: Brand the launcher icon / splash
        working-directory: mobile
        env:
          APP: ${{ matrix.app }}
        run: node scripts/icons.mjs "$APP"

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      # ── Signed release APK — only when the keystore secrets exist (mobile/README §6)
      - name: Decode keystore
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/boostpay-release.keystore
          echo "present=true" >> $GITHUB_OUTPUT

      - name: Build release APK (signed)
        if: ${{ steps.keystore.outputs.present == 'true' }}
        working-directory: mobile/android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/boostpay-release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect APKs
        env:
          APP: ${{ matrix.app }}
        run: |
          mkdir -p out
          find mobile/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          for f in out/*.apk; do
            base=$(basename "$f" .apk)
            mv "$f" "out/boostpay-$APP-$base.apk"
          done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: boostpay-${{ matrix.app }}-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
